<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learner Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16302b;--mute:#5d726c;--line:#d7e0dc;--brand:#0e6b5c;--bi:#fff;--warn:#b4491f;--ok:#1d7a3e;--soft:#e3efeb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#16241f;--ink:#e6f1ed;--mute:#97aea7;--line:#27403a;--brand:#3cc1a8;--bi:#08201b;--warn:#f08a5d;--ok:#5fd18a;--soft:#1d332d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card,.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.item{border-left:5px solid var(--warn)}.item.done{border-left-color:var(--ok)}
.auth{max-width:380px;margin:8vh auto}
label{display:block;margin-top:12px;font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-top:4px}
.btn{background:var(--brand);color:var(--bi);border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;width:auto}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.btn[disabled]{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.meta{color:var(--mute);font-size:.88rem;margin:4px 0 10px}
.tag{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft)}
.tag.ok{color:var(--ok)}.tag.no{color:var(--warn)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.sub{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:.92rem}
.err{color:var(--warn);min-height:1.4em;margin-top:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div id="setup" class="card" hidden><h2>Setup needed</h2><p>Open index.html and paste your Supabase URL and anon key at the top of the script.</p></div>

<form id="auth" class="card auth" hidden>
  <h1 id="aT">Learner Portal</h1>
  <div id="su" hidden>
    <label for="fn">Full name</label><input id="fn">
    <label for="sn">Student number</label><input id="sn">
    <label for="cl">Class</label><select id="cl"><option>Grade 11</option><option>Grade 12</option><option>Year 1</option><option>Year 2</option></select>
  </div>
  <label for="em">Email</label><input id="em" type="email" required autocomplete="email">
  <label for="pw">Password (6+ characters)</label><input id="pw" type="password" required minlength="6" autocomplete="current-password">
  <div class="err" id="aE"></div>
  <button class="btn" id="aB" style="width:100%">Sign in</button>
  <p style="text-align:center"><a href="#" id="aS">New learner? Create an account</a></p>
</form>

<main id="app" hidden>
  <div class="top"><div><h2 id="hi"></h2><small id="who" class="meta"></small></div><button class="btn ghost" id="out">Sign out</button></div>
  <div id="teacher" hidden>
    <form class="card" id="tf">
      <h3>Post a new assignment</h3>
      <label for="tc">Subject</label><input id="tc" required>
      <label for="tt">Title</label><input id="tt" required>
      <label for="tb">Instructions</label><textarea id="tb" rows="3"></textarea>
      <label for="tcl">Class</label><select id="tcl"><option value="">All classes</option><option>Grade 11</option><option>Grade 12</option><option>Year 1</option><option>Year 2</option></select>
      <label for="td">Due date</label><input id="td" type="datetime-local" required>
      <label for="tf2">Attach a file (optional)</label><input id="tf2" type="file">
      <button class="btn" style="margin-top:14px" id="tB">Post assignment</button>
    </form>
  </div>
  <div id="list"></div>
</main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ====== PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API) ======
const SUPABASE_URL = "https://sfynxfrrzeimrmlpnwfu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bVkE05593udBC907S--emA_grITspAe";
// =======================================================================
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const safe=n=>n.replace(/[^\w.\-]+/g,'_');
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3000)}
if(!SUPABASE_URL||!SUPABASE_ANON_KEY){$('setup').hidden=false}
else{
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let me=null, signup=false, files={};

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){$('auth').hidden=false;$('app').hidden=true;return}
  $('auth').hidden=true;$('app').hidden=false;
  const {data}=await db.from('profiles').select('*').eq('id',session.user.id).single();
  me=data||{id:session.user.id,full_name:'',role:'student'};
  $('hi').textContent='Hi, '+(me.full_name||'there').split(' ')[0];
  $('who').textContent=me.role==='teacher'?'Teacher':`${me.student_no||''} · ${me.class||''}`;
  $('teacher').hidden=me.role!=='teacher';
  load();
}

async function load(){
  let q=db.from('assignments').select('*').order('due');
  const {data:tasks,error}=await q;
  if(error){$('list').innerHTML='<div class="card">Could not load assignments: '+esc(error.message)+'</div>';return}
  const list=tasks.filter(t=>me.role==='teacher'||!t.class||t.class===me.class);
  if(!list.length){$('list').innerHTML='<div class="card" style="text-align:center">No assignments yet.</div>';return}
  let subs={};
  if(me.role!=='teacher'){
    const {data}=await db.from('submissions').select('*').eq('student_id',me.id);
    (data||[]).forEach(s=>subs[s.assignment_id]=s);
  }
  $('list').innerHTML=list.map(t=>me.role==='teacher'?teacherCard(t):studentCard(t,subs[t.id])).join('');
}

function studentCard(t,s){
  const late=!s&&new Date(t.due)<new Date();
  return `<article class="item ${s?'done':''}">
   <div class="row"><h3>${esc(t.title)}</h3><span class="tag ${s?'ok':'no'}">${s?(s.late?'Submitted late':'Submitted'):late?'Overdue':'Not submitted'}</span></div>
   <div class="meta">${esc(t.course)} · Due ${fmt(t.due)}</div>
   <p style="margin:0 0 12px">${esc(t.brief)}</p>
   <div class="row" style="justify-content:flex-start">
    <button class="btn ghost" data-dl="${t.id}">Download task</button>
    <input type="file" data-up="${t.id}" style="flex:1;min-width:180px">
    <button class="btn" data-sub="${t.id}" disabled>${s?'Resubmit':'Submit work'}</button>
   </div>
   ${s?`<div class="sub">Sent ${fmt(s.submitted_at)}: <b>${esc(s.file_name)}</b>
     <button class="btn ghost" style="padding:3px 10px;margin-left:6px" data-mine="${s.file_path}" data-name="${esc(s.file_name)}">Download my file</button></div>`:''}
  </article>`;
}
function teacherCard(t){
  return `<article class="item done"><div class="row"><h3>${esc(t.title)}</h3>
   <button class="btn ghost" data-view="${t.id}">View submissions</button></div>
   <div class="meta">${esc(t.course)} · ${esc(t.class||'All classes')} · Due ${fmt(t.due)}</div>
   <div id="v-${t.id}"></div></article>`;
}

async function signed(bucket,path,name){
  const {data,error}=await db.storage.from(bucket).createSignedUrl(path,120,{download:name});
  if(error){toast('Download failed: '+error.message);return}
  location.href=data.signedUrl;
}

document.addEventListener('click',async e=>{
  const g=a=>e.target.closest('['+a+']'); let x;
  if(x=g('data-dl')){
    const {data:t}=await db.from('assignments').select('*').eq('id',x.dataset.dl).single();
    if(t.file_path)return signed('tasks',t.file_path,t.file_name);
    const url='data:text/plain;charset=utf-8,'+encodeURIComponent(`${t.title}\n${t.course}\nDue: ${fmt(t.due)}\n\n${t.brief||''}\n`);
    const a=document.createElement('a');a.href=url;a.download=safe(t.title)+'.txt';a.click();
  }else if(x=g('data-mine')){signed('submissions',x.dataset.mine,x.dataset.name)}
  else if(x=g('data-sub')){
    const id=x.dataset.sub,f=files[id]; if(!f)return;
    x.disabled=true;x.textContent='Uploading…';
    const path=`${me.id}/${id}/${Date.now()}_${safe(f.name)}`;
    const up=await db.storage.from('submissions').upload(path,f,{upsert:true});
    if(up.error){toast('Upload failed: '+up.error.message);x.disabled=false;x.textContent='Submit work';return}
    const r=await db.from('submissions').upsert({assignment_id:id,student_id:me.id,file_path:path,file_name:f.name,size:f.size},{onConflict:'assignment_id,student_id'});
    if(r.error){toast('Could not save: '+r.error.message);x.disabled=false;return}
    delete files[id];toast('Submitted: '+f.name);load();
  }else if(x=g('data-view')){
    const box=$('v-'+x.dataset.view);
    const {data,error}=await db.from('submissions').select('*, profiles(full_name,student_no,class)').eq('assignment_id',x.dataset.view).order('submitted_at');
    if(error){box.innerHTML='<div class="sub">'+esc(error.message)+'</div>';return}
    box.innerHTML=data.length?data.map(s=>`<div class="sub row"><span><b>${esc(s.profiles?.full_name)}</b> (${esc(s.profiles?.student_no)}) · ${fmt(s.submitted_at)} ${s.late?'<span class="tag no">Late</span>':''}</span>
      <button class="btn ghost" style="padding:3px 10px" data-mine="${s.file_path}" data-name="${esc(s.file_name)}">Download</button></div>`).join(''):'<div class="sub">No submissions yet.</div>';
  }
});
document.addEventListener('change',e=>{
  const id=e.target.dataset.up; if(!id)return;
  const f=e.target.files[0]; if(!f)return;
  if(f.size>20*1024*1024){toast('File is over 20 MB.');e.target.value='';return}
  files[id]=f;document.querySelector(`[data-sub="${id}"]`).disabled=false;
});

$('aS').onclick=e=>{e.preventDefault();signup=!signup;$('su').hidden=!signup;
  $('aB').textContent=signup?'Create account':'Sign in';
  $('aS').textContent=signup?'Have an account? Sign in':'New learner? Create an account';$('aE').textContent=''};
$('auth').onsubmit=async e=>{
  e.preventDefault();$('aE').textContent='';
  const email=$('em').value.trim(),password=$('pw').value;
  const r=signup
   ?await db.auth.signUp({email,password,options:{data:{full_name:$('fn').value.trim(),student_no:$('sn').value.trim(),class:$('cl').value}}})
   :await db.auth.signInWithPassword({email,password});
  if(r.error){$('aE').textContent=r.error.message;return}
  if(signup&&!r.data.session){$('aE').textContent='Check your email to confirm, then sign in.';return}
  boot();
};
$('out').onclick=async()=>{await db.auth.signOut();me=null;boot()};

$('tf').onsubmit=async e=>{
  e.preventDefault();$('tB').disabled=true;
  let file_path=null,file_name=null;const f=$('tf2').files[0];
  if(f){file_path=`${Date.now()}_${safe(f.name)}`;file_name=f.name;
    const up=await db.storage.from('tasks').upload(file_path,f);
    if(up.error){toast('Upload failed: '+up.error.message);$('tB').disabled=false;return}}
  const r=await db.from('assignments').insert({course:$('tc').value,title:$('tt').value,brief:$('tb').value,
    class:$('tcl').value||null,due:new Date($('td').value).toISOString(),file_path,file_name});
  $('tB').disabled=false;
  if(r.error){toast(r.error.message);return}
  $('tf').reset();toast('Assignment posted');load();
};
boot();
}
</script>
</body>
</html>
